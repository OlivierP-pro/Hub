<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Research Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Welcome to My Research Website</h1>

    <!-- Repository 1 -->
    <div class="repository">
        <h2 onclick="toggleContent('repo1')">Repository 1</h2>
        <div id="repo1" class="content" style="display: none;">
            <p class="abstract">This is the abstract for Repository 1. It provides a brief overview of the research.</p>
            <div class="progress-bar">
                <div class="progress" style="width: 75%;"></div> <!-- Adjust width for progress -->
            </div>
            <p class="progress-text">75% completed</p> <!-- Progress text -->
            <a href="pdf/subtitles_caption.pdf" target="_blank">Download PDF</a>
        </div>
    </div>

    <!-- Repository 2 -->
    <div class="repository">
        <h2 onclick="toggleContent('repo2')">Repository 2</h2>
        <div id="repo2" class="content" style="display: none;">
            <p class="abstract">This is the abstract for Repository 2. It provides a brief overview of the research.</p>
            <div class="progress-bar">
                <div class="progress" style="width: 30%;"></div> <!-- Adjust width for progress -->
            </div>
            <p class="progress-text">30% completed</p> <!-- Progress text -->
            <a href="pdf/subtitles_caption.pdf" target="_blank">Download PDF</a>
        </div>
    </div>

    <!-- Add more repositories as needed -->

    <script>
        function toggleContent(repoId) {
            const content = document.getElementById(repoId);
            if (content.style.display === "none") {
                content.style.display = "block";
            } else {
                content.style.display = "none";
            }
        }
    </script>
</body>
</html>
